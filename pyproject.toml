[project]
name = "research-brief-agent"
version = "2.0.0"
description = "Research workspace that ingests sources, drafts cited briefs, and tracks outline→draft→review."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
